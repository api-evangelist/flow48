aid: flow48
name: Flow48
description: >-
  Flow48 is an SME financing platform founded in March 2022 and backed by
  Speedinvest that provides non-dilutive, collateral-free capital to small and
  medium businesses across the GCC and wider MENA region, with a focus on the
  e-commerce and food & beverage sectors. Its two core products are
  revenue-based financing, which converts a business's future revenues into
  upfront capital repaid as a share of sales, and invoice financing, which
  accelerates cash locked in unpaid invoices. Flow48 markets funding decisions
  and disbursement within 24 to 48 hours with flexible repayment and no equity
  surrender. The company operates a self-service borrower onboarding portal but
  does not currently publish a public developer program, API reference, or SDKs.
